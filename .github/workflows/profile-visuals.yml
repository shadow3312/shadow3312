name: Profile visuals (3D contrib + snake)

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit 3D graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: update 3D contributions"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D85A30&color_dots=#EBEDF0,#9FD8C7,#4FB394,#0F6E56,#183153
            dist/snake-dark.svg?palette=github-dark&color_snake=#D85A30&color_dots=#161B22,#0F6E56,#4FB394,#9FD8C7,#FAFAF7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
