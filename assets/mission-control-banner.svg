<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Mission Control</title>
  <desc id="desc">A dark technical mission-control panel for a software engineer exploring products, systems and 3D.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="1" stop-color="#102A3D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6C1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#55E6C1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#55E6C1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9AB6C8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <path d="M0 74H1200 M0 256H1200" stroke="#8CA8BB" stroke-opacity=".18"/>
  <path d="M44 74H420" stroke="url(#beam)" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="48" fill="#55E6C1" font-size="14" letter-spacing="3">INDEPENDENT ENGINEERING OPERATIONS</text>
    <text x="54" y="145" fill="#F1F7FB" font-size="54" font-weight="700" letter-spacing="-2">MISSION CONTROL</text>
    <text x="57" y="181" fill="#B6C9D7" font-size="19">Software systems. Useful products. Real-time worlds.</text>
    <text x="57" y="222" fill="#55E6C1" font-size="13" letter-spacing="2">BUILD / EXPLORE / ITERATE</text>
    <text x="54" y="292" fill="#7E9CAF" font-size="12" letter-spacing="2">ENGINEERING LOG  //  PROFILE README</text>
    <text x="1145" y="292" fill="#7E9CAF" font-size="12" text-anchor="end">SYS.ONLINE</text>
  </g>
  <g transform="translate(950 160)">
    <circle r="87" fill="#0B2030" stroke="#29485A" stroke-width="1.5"/>
    <circle r="66" fill="none" stroke="#55E6C1" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle r="45" fill="none" stroke="#8CA8BB" stroke-opacity=".5"/>
    <ellipse rx="82" ry="29" fill="none" stroke="#FFAD66" stroke-opacity=".8" transform="rotate(-35)"/>
    <circle cx="58" cy="-49" r="6" fill="#FFAD66"/>
    <circle cx="-30" cy="32" r="4" fill="#55E6C1"/>
    <path d="M-15 -15L0 -37L15 -15L8 18L0 25L-8 18Z" fill="#55E6C1" fill-opacity=".9"/>
    <path d="M-8 18L-24 35L-8 29 M8 18L24 35L8 29" fill="none" stroke="#55E6C1" stroke-width="2"/>
    <circle r="4" fill="#F1F7FB"/>
  </g>
  <g stroke="#55E6C1" stroke-opacity=".5" fill="none">
    <path d="M850 77h48v-20h30"/>
    <path d="M1038 230h54v18h40"/>
    <path d="M870 226h-24v18h-30"/>
  </g>
  <g fill="#55E6C1">
    <circle cx="850" cy="77" r="3"/><circle cx="1132" cy="248" r="3"/><circle cx="816" cy="244" r="3"/>
  </g>
</svg>
